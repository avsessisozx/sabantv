name: Build

# https://docs.github.com/en/actions/learn-github-actions/workflow-syntax-for-github-actions#concurrency
concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      # choose your default branch
      - master
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK, GitHub'ın hazır imajında yüklü gelir; ayrı bir action gerekmez.
      # Tüm çıktı build.log dosyasına yazılır ve builds dalına yüklenir (hata ayıklama için).
      - name: Build Plugins
        run: |
          set -o pipefail
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            java -version
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            cd "$GITHUB_WORKSPACE/src"
            chmod +x gradlew
            ./gradlew make makePluginsJson --stacktrace
          } 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Copy build outputs
        run: |
          rm -f "$GITHUB_WORKSPACE"/builds/*.cs3
          cp "$GITHUB_WORKSPACE"/src/*/build/*.cs3 "$GITHUB_WORKSPACE/builds"
          cp "$GITHUB_WORKSPACE/src/build/plugins.json" "$GITHUB_WORKSPACE/builds"

      - name: Push builds
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/builds"
          cp "$GITHUB_WORKSPACE/build.log" build.log || true
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force
